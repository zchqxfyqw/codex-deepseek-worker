name: Bug report
description: Report a bug in the DeepSeek Worker repository
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include API keys, tokens, logs, or personal paths.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Redact any secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact offline commands used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Codex CLI, PowerShell, and DeepSeek Worker version.
    validations:
      required: true
