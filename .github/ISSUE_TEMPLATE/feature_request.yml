name: Feature request
description: Suggest an improvement to the DeepSeek Worker
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Keep the proposal focused and explain the user impact.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should the feature work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives were considered?
